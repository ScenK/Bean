name: Mac installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # gh release create needs write access; default token is read-only

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck
      # Self-signed cert (packages/app/scripts/make-signing-cert.sh): a stable designated
      # requirement keeps users' macOS privacy grants across updates. Required — an ad-hoc
      # release would reset them for everyone, so a missing secret fails the build.
      - name: Import signing cert
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$MAC_SIGN_P12" ]; then
            echo "::error::MAC_SIGN_P12 secret missing (see packages/app/scripts/make-signing-cert.sh)"
            exit 1
          fi
          kc="$RUNNER_TEMP/bean-sign.keychain-db"
          kcpw=$(openssl rand -hex 16)
          echo "$MAC_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$MAC_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          # codesign on the runner only finds identities in search-list keychains, --keychain
          # alone fails with "no identity found".
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"
          id=$(security find-identity -p codesigning "$kc" | awk '/\)/{print $2; exit}')
          echo "BEAN_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
          echo "BEAN_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - run: pnpm dist:mac
        env:
          # electron-builder's own signing stays off (identity: null); after-sign.mjs signs.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Check signature is not ad-hoc
        run: codesign -d -r- packages/app/release/mac-*/Bean.app 2>&1 | grep 'certificate leaf'
      # bean-core-<ver>.tar.gz (#835): dist:mac already built host + bots. Never matches the
      # desktop updater's `-arm64-mac.zip` selector.
      - run: node scripts/pack-bean-core.mjs
      - run: node packages/app/scripts/sign-release.mjs packages/app/release/*.zip release/bean-core-*.tar.gz
        # `secrets` isn't an allowed context in `if:` (GitHub Actions restricts it to
        # env/with/run) — route it through `env` first, which `if:` can read.
        if: ${{ env.UPDATE_ED_PRIVATE_KEY != '' }}
        env:
          UPDATE_ED_PRIVATE_KEY: ${{ secrets.UPDATE_ED_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: bean-mac
          path: |
            packages/app/release/*.dmg
            packages/app/release/*.zip
            packages/app/release/*.zip.sig
            release/bean-core-*.tar.gz
            release/bean-core-*.tar.gz.sig
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(packages/app/release/*.dmg packages/app/release/*.zip packages/app/release/*.zip.sig release/bean-core-*.tar.gz release/bean-core-*.tar.gz.sig)

          # GitHub's API intermittently returns 5xx (v0.20.0/v0.20.1 both died here
          # on a transient HTTP 503 after a fully successful build). Retry with
          # backoff so a blip doesn't discard an otherwise-complete release, and stay
          # idempotent: if a prior attempt already made the release, upload into it.
          attempt=1
          max=5
          until [ "$attempt" -gt "$max" ]; do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber && exit 0
            else
              gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --generate-notes && exit 0
            fi
            echo "Attach-to-release attempt ${attempt}/${max} failed; retrying in $((attempt * 10))s..." >&2
            sleep "$((attempt * 10))"
            attempt=$((attempt + 1))
          done
          echo "::error::Failed to attach release ${GITHUB_REF_NAME} after ${max} attempts" >&2
          exit 1
