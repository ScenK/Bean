name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request supersedes its running checks; pushes to main all run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the dependabot lockfile push below
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Dependabot bumps package.json but can't always regenerate pnpm-lock.yaml
      # itself (e.g. very-recently-published versions). Do it here instead of
      # rejecting the PR outright.
      - name: Sync lockfile for dependabot PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/pnpm-sync.log"
          if ! pnpm install --lockfile-only --no-frozen-lockfile 2>&1 | tee "$log"; then
            # pnpm's minimumReleaseAge (pnpm-workspace.yaml) refuses versions
            # published in the last 24h. Nothing to fix in the PR — it just
            # opened too early — so say so instead of leaving a bare stack.
            if grep -q ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION "$log"; then
              echo "::error::This bump is younger than the minimumReleaseAge window in pnpm-workspace.yaml. Re-run this job once the release clears that window; dependabot's cooldown in .github/dependabot.yml should normally hold PRs back until then."
            fi
            exit 1
          fi
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: sync pnpm-lock.yaml"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck

  e2e:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Tiered (.memory/convention-e2e-tiers.md): pull requests run the small @ci set,
      # pushes to main run the full suite.
      - run: pnpm --filter @bean/app run ${{ github.event_name == 'pull_request' && 'test:e2e:ci' || 'test:e2e' }}
